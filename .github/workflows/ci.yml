name: CI

permissions:
  contents: read

on:
  push:
  schedule:
    - cron: "0 0 * * *"

jobs:
  node22:
    name: Node 22
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: checkout node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm build
      - run: pnpm test --run
  node24:
    name: Node 24
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: checkout node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm build
      - run: pnpm cs
      - run: pnpm lint
      - run: pnpm test --run --coverage
      - run: pnpm infection
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      - name: coveralls.io
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: sonarcloud.io
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  node26:
    name: Node 26
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: checkout node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm build
      - run: pnpm test --run
