<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 843" width="1206" height="843" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>chubbyts-framework request/response workflow</title>
  <desc>A PSR-15 inspired middleware pipe: the server request travels inwards through the application middlewares to the route handler, the response travels back outwards to the server.</desc>

  <defs>
    <marker id="arrow-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1206" height="843" fill="#ffffff"/>
  <g transform="translate(123 0)">

  <!-- ============ Client / Server ============ -->
  <rect x="380" y="24" width="200" height="44" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="52" text-anchor="middle" font-weight="600" fill="#0f172a">Client → Server</text>
  <text x="480" y="90" text-anchor="middle" fill="#475569" font-size="12">GET /hello/world</text>

  <!-- ============ Application frame ============ -->
  <rect x="200" y="112" width="560" height="580" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="216" y="138" font-weight="700" fill="#0f172a">Application</text>
  <text x="744" y="138" text-anchor="end" fill="#64748b" font-size="12">createApplication( middlewares ) → pipe( middlewares )</text>

  <!-- ErrorMiddleware -->
  <rect x="224" y="156" width="512" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="180" text-anchor="middle" font-weight="600" fill="#7f1d1d">ErrorMiddleware</text>
  <text x="480" y="199" text-anchor="middle" fill="#7f1d1d" font-size="12">catches anything thrown → HttpError → HTML error response</text>

  <!-- RouteMatcherMiddleware -->
  <rect x="224" y="232" width="512" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="256" text-anchor="middle" font-weight="600" fill="#1e3a8a">RouteMatcherMiddleware</text>
  <text x="480" y="275" text-anchor="middle" fill="#1e3a8a" font-size="12">match( serverRequest ) → attributes: { route, ...route.attributes }</text>

  <!-- Middleware* (app) -->
  <rect x="224" y="308" width="512" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="332" text-anchor="middle" font-weight="600" fill="#334155">Middleware *</text>
  <text x="480" y="351" text-anchor="middle" fill="#64748b" font-size="12">any Middleware function, e.g. createLazyMiddleware(…), …</text>

  <!-- RouteHandler frame -->
  <rect x="224" y="384" width="512" height="284" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="240" y="410" font-weight="700" fill="#14532d">RouteHandler **</text>
  <text x="720" y="410" text-anchor="end" fill="#166534" font-size="12">route = serverRequest.attributes.route</text>

  <!-- Route frame -->
  <rect x="248" y="428" width="464" height="220" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="264" y="452" font-weight="600" fill="#14532d">Route</text>
  <text x="696" y="452" text-anchor="end" fill="#166534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">GET /hello/:name</text>
  <text x="696" y="470" text-anchor="end" fill="#64748b" font-size="12">pipe( route.middlewares )( serverRequest, route.handler )</text>

  <!-- Middleware* (route) -->
  <rect x="272" y="488" width="416" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="512" text-anchor="middle" font-weight="600" fill="#334155">Middleware *</text>
  <text x="480" y="531" text-anchor="middle" fill="#64748b" font-size="12">route specific, runs only for this route</text>

  <!-- Handler -->
  <rect x="272" y="564" width="416" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="480" y="588" text-anchor="middle" font-weight="600" fill="#14532d">Handler</text>
  <text x="480" y="607" text-anchor="middle" fill="#166534" font-size="12">route.handler builds the Response: "Hello, world"</text>

  <!-- ============ Request arrow (left, downwards) ============ -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <path d="M380 46 H120 V592 H270" marker-end="url(#arrow-req)"/>
  </g>
  <text x="112" y="120" text-anchor="end" font-weight="700" fill="#1d4ed8">ServerRequest</text>
  <text x="112" y="138" text-anchor="end" fill="#1d4ed8" font-size="12">@chubbyts/chubbyts-undici-server</text>
  <g fill="#1d4ed8" font-size="12" text-anchor="end">
    <text x="112" y="268">+ route</text>
    <text x="112" y="286">+ name = "world"</text>
  </g>
  <!-- ticks showing where the request passes through each layer -->
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="120" y1="184" x2="224" y2="184"/>
    <line x1="120" y1="260" x2="224" y2="260"/>
    <line x1="120" y1="336" x2="224" y2="336"/>
    <line x1="120" y1="516" x2="272" y2="516"/>
  </g>

  <!-- ============ Response arrow (right, upwards) ============ -->
  <g stroke="#15803d" stroke-width="2" fill="none">
    <path d="M688 592 H840 V60"/>
    <path d="M840 46 H592" marker-end="url(#arrow-res)"/>
  </g>
  <text x="848" y="120" font-weight="700" fill="#15803d">Response</text>
  <text x="848" y="138" fill="#15803d" font-size="12">@chubbyts/chubbyts-undici-server</text>
  <g stroke="#15803d" stroke-width="2">
    <line x1="736" y1="184" x2="840" y2="184"/>
    <line x1="736" y1="260" x2="840" y2="260"/>
    <line x1="736" y1="336" x2="840" y2="336"/>
    <line x1="688" y1="516" x2="840" y2="516"/>
  </g>

  <!-- Error short-circuit -->
  <path d="M770 212 C 790 200, 800 196, 812 190" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-err)"/>
  <text x="848" y="176" fill="#b91c1c" font-size="12">on throw:</text>
  <text x="848" y="192" fill="#b91c1c" font-size="12">error Response</text>

  <!-- ============ Legend ============ -->
  <g font-size="12" fill="#475569">
    <text x="200" y="740">*  optional – any number of middlewares, in the given order</text>
    <text x="200" y="760">** default handler, can be overridden via the second argument of createApplication</text>
    <text x="200" y="790" fill="#334155">pipe() wraps each middleware around the next one: the server request travels inwards, the response travels outwards.</text>
    <line x1="200" y1="812" x2="236" y2="812" stroke="#1d4ed8" stroke-width="2"/>
    <text x="244" y="816">ServerRequest</text>
    <line x1="360" y1="812" x2="396" y2="812" stroke="#15803d" stroke-width="2"/>
    <text x="404" y="816">Response</text>
    <line x1="490" y1="812" x2="526" y2="812" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="534" y="816">Error short-circuit</text>
    <line x1="660" y1="812" x2="696" y2="812" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="704" y="816">Optional</text>
  </g>
  </g>
</svg>
